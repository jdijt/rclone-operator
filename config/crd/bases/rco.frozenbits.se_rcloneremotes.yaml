                      connections is the maximum number of concurrent SSH connections rclone may
                      open to this host (rclone option: connections). Unset means rclone's default
                      of unlimited.
                    format: int32
                    minimum: 1
                    type: integer
                  host:
                    description: 'host to connect to (rclone option: host).'
                    minLength: 1
                    type: string
                  passwordRef:
                    description: 'passwordRef selects the Secret key holding the SSH
                      password (rclone option: pass).'
                    properties:
                      key:
                        description: key within the Secret's data.
                        minLength: 1
                        type: string
                      name:
                        description: name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  port:
                    default: 22
                    description: 'port to connect to (rclone option: port).'
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  privateKeyPassphraseRef:
                    description: |-
                      privateKeyPassphraseRef selects the Secret key holding the passphrase for
                      privateKeyRef, if the key is encrypted (rclone option: key_file_pass).
                    properties:
                      key:
                        description: key within the Secret's data.
                        minLength: 1
                        type: string
                      name:
                        description: name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  privateKeyRef:
                    description: |-
                      privateKeyRef selects the Secret key holding a PEM-encoded private key
                      (rclone option: key_pem).
                    properties:
                      key:
                        description: key within the Secret's data.
                        minLength: 1
                        type: string
                      name:
                        description: name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  user:
                    description: 'user to log in as (rclone option: user).'
                    minLength: 1
                    type: string
                required:
                - host
                - user
                type: object
                x-kubernetes-validations:
                - message: one of passwordRef or privateKeyRef must be set
                  rule: has(self.passwordRef) || has(self.privateKeyRef)
              template:
