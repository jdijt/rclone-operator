                  template configures a remote from a free-form rclone connection string
                  template with secret inputs.
                properties:
                  inputs:
                    additionalProperties:
                      description: |-
                        SecretKeyRef selects a single key of a Secret. For a namespaced RCloneRemote the
                        Secret is looked up in the remote's namespace; for an RCloneClusterRemote it is
                        looked up in the operator's namespace.
                      properties:
                        key:
                          description: key within the Secret's data.
                          minLength: 1
                          type: string
                        name:
                          description: name of the Secret.
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    description: inputs maps placeholder names to the Secret keys
                      that fill them.
                    type: object
                  template:
                    description: template is the rclone connection string with placeholders
                      for inputs.
                    minLength: 1
                    type: string
                required:
                - template
                type: object
              type:
                description: type selects the rclone backend. Exactly the matching
                  backend field must be set.
                enum:
                - sftp
                - s3
                - crypt
                - template
                type: string
            required:
