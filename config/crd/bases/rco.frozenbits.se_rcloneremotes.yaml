---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: rcloneremotes.rco.frozenbits.se
spec:
  group: rco.frozenbits.se
  names:
    kind: RCloneRemote
    listKind: RCloneRemoteList
    plural: rcloneremotes
    singular: rcloneremote
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RCloneRemote is the Schema for the rcloneremotes API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of RCloneRemote
            properties:
              crypt:
                description: crypt configures an rclone crypt backend wrapping another
                  remote.
                properties:
                  directoryNameEncryption:
                    default: true
                    description: |-
                      directoryNameEncryption enables encryption of directory names
                      (rclone option: directory_name_encryption).
                    type: boolean
                  filenameEncoding:
                    default: base32
                    description: |-
                      filenameEncoding selects the encoding of encrypted file names
                      (rclone option: filename_encoding).
                    enum:
                    - base32
                    - base64
                    - base32768
                    type: string
                  filenameEncryption:
                    default: standard
                    description: |-
                      filenameEncryption selects how file names are encrypted
                      (rclone option: filename_encryption).
                    enum:
                    - standard
                    - obfuscate
                    - "off"
                    type: string
                  passwordRef:
                    description: |-
                      passwordRef selects the Secret key holding the encryption password
                      (rclone option: password).
                    properties:
                      key:
                        description: key within the Secret's data.
                        minLength: 1
                        type: string
                      name:
                        description: name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  path:
                    description: |-
                      path within the wrapped remote that holds the encrypted data
                      (rclone option: remote, the part after the colon).
                    type: string
                  remoteRef:
                    description: 'remoteRef references the remote to wrap (rclone
