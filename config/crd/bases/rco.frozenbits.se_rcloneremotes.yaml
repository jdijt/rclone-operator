                      key:
                        description: key within the Secret's data.
                        minLength: 1
                        type: string
                      name:
                        description: name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - passwordRef
                - remoteRef
                type: object
              s3:
                description: s3 configures an rclone s3 backend.
                properties:
                  accessKeyIDRef:
                    description: |-
                      accessKeyIDRef selects the Secret key holding the access key ID
                      (rclone option: access_key_id).
                    properties:
                      key:
                        description: key within the Secret's data.
                        minLength: 1
                        type: string
                      name:
                        description: name of the Secret.
                        minLength: 1
                        type: string
