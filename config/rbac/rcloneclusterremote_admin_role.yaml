# This rule is not used by the project rclone-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over rco.frozenbits.se.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: rclone-operator
    app.kubernetes.io/managed-by: kustomize
  name: rcloneclusterremote-admin-role
rules:
- apiGroups:
  - rco.frozenbits.se
  resources:
  - rcloneclusterremotes
  verbs:
  - '*'
- apiGroups:
  - rco.frozenbits.se
  resources:
  - rcloneclusterremotes/status
  verbs:
  - get
