---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - rco.frozenbits.se
  resources:
  - rcloneremotes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rco.frozenbits.se
  resources:
  - rcloneremotes/finalizers
  verbs:
  - update
- apiGroups:
  - rco.frozenbits.se
  resources:
  - rcloneremotes/status
  verbs:
  - get
  - patch
  - update
