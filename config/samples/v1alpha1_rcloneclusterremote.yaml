# An s3 remote on a self-hosted Ceph cluster. The bucket is not part of the remote,
# it is the first path element on the sync endpoint.
# The referenced Secret is looked up in the operator's own namespace.
apiVersion: rco.frozenbits.se/v1alpha1
kind: RCloneClusterRemote
metadata:
  labels:
    app.kubernetes.io/name: rclone-operator
    app.kubernetes.io/managed-by: kustomize
  name: rcloneclusterremote-sample
spec:
  type: s3
  s3:
    provider: Ceph
    endpoint: https://s3.example.com
    forcePathStyle: true
    accessKeyIDRef:
      name: rcloneclusterremote-sample-credentials
      key: accessKeyID
    secretAccessKeyRef:
      name: rcloneclusterremote-sample-credentials
      key: secretAccessKey
