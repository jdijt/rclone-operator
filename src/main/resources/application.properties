# Operator
%dev.rclone-operator.operator-namespace=rclone-operator
%test.rclone-operator.operator-namespace=rclone-operator

# Tests bring their own API server (KubeApiServerResource).
%test.quarkus.kubernetes-client.devservices.enabled=false

# CRDs are generated at build time into target/kubernetes; apply them automatically outside prod.
quarkus.operator-sdk.crd.apply=true
%prod.quarkus.operator-sdk.crd.apply=false

# Deployment manifests (quarkus-kubernetes)
quarkus.kubernetes.env.fields."RCLONE_OPERATOR_OPERATOR_NAMESPACE"=metadata.namespace

# Webhooks: the API server calls them over HTTPS, with a certificate issued by cert-manager
# (see src/main/kubernetes/kubernetes.yml).
%prod.quarkus.http.ssl.certificate.files=/etc/webhook-tls/tls.crt
%prod.quarkus.http.ssl.certificate.key-files=/etc/webhook-tls/tls.key
quarkus.kubernetes.namespace=rclone-operator
quarkus.kubernetes.ports.https.container-port=8443
quarkus.kubernetes.secret-volumes.webhook-tls.secret-name=rclone-operator-webhook-tls
quarkus.kubernetes.mounts.webhook-tls.path=/etc/webhook-tls
quarkus.kubernetes.mounts.webhook-tls.read-only=true

